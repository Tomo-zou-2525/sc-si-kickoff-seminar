<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ブロック崩し - 生成AIデモ</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --accent: #38bdf8;
      --text: #e2e8f0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: radial-gradient(circle at 50% 0%, #1e293b, var(--bg));
      color: var(--text);
      font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    }
    h1 {
      margin: 0;
      font-size: 20px;
      letter-spacing: 0.05em;
      font-weight: 600;
    }
    .hud {
      display: flex;
      gap: 24px;
      font-size: 15px;
      color: #94a3b8;
    }
    .hud b { color: var(--accent); font-size: 18px; }
    canvas {
      background: var(--panel);
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      touch-action: none;
    }
    .hint { font-size: 13px; color: #64748b; }
    .overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(4px);
    }
    .overlay.show { display: flex; }
    .overlay h2 { margin: 0; font-size: 32px; }
    button {
      padding: 12px 28px;
      font-size: 16px;
      border: none;
      border-radius: 999px;
      background: var(--accent);
      color: #0f172a;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s ease;
    }
    button:active { transform: scale(0.96); }
  </style>
</head>
<body>
  <h1>ブロック崩し</h1>
  <div class="hud">
    <div>スコア <b id="score">0</b></div>
    <div>残機 <b id="lives">3</b></div>
  </div>
  <canvas id="game" width="640" height="440"></canvas>
  <div class="hint">マウス／指でパドルを左右に動かす　·　スペースキーで開始</div>

  <div class="overlay" id="overlay">
    <h2 id="overlay-title">ブロック崩し</h2>
    <button id="start-btn">スタート</button>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const W = canvas.width;
    const H = canvas.height;

    const scoreEl = document.getElementById("score");
    const livesEl = document.getElementById("lives");
    const overlay = document.getElementById("overlay");
    const overlayTitle = document.getElementById("overlay-title");
    const startBtn = document.getElementById("start-btn");

    // --- ゲーム状態 ---
    const paddle = { w: 96, h: 12, x: (W - 96) / 2, y: H - 28, speed: 7 };
    const ball = { x: W / 2, y: H - 44, r: 8, dx: 4, dy: -4 };

    const brick = { rows: 5, cols: 9, w: 58, h: 20, gap: 6, top: 48, left: 20 };
    let bricks = [];
    const colors = ["#f87171", "#fb923c", "#fbbf24", "#4ade80", "#38bdf8"];

    let score = 0;
    let lives = 3;
    let running = false;
    let launched = false;

    function buildBricks() {
      bricks = [];
      for (let r = 0; r < brick.rows; r++) {
        for (let c = 0; c < brick.cols; c++) {
          bricks.push({
            x: brick.left + c * (brick.w + brick.gap),
            y: brick.top + r * (brick.h + brick.gap),
            alive: true,
            color: colors[r % colors.length],
          });
        }
      }
    }

    function resetBall() {
      ball.x = paddle.x + paddle.w / 2;
      ball.y = paddle.y - ball.r - 1;
      ball.dx = 4 * (Math.random() > 0.5 ? 1 : -1);
      ball.dy = -4;
      launched = false;
    }

    function resetGame() {
      score = 0;
      lives = 3;
      buildBricks();
      paddle.x = (W - paddle.w) / 2;
      resetBall();
      updateHud();
    }

    function updateHud() {
      scoreEl.textContent = score;
      livesEl.textContent = lives;
    }

    // --- 入力 ---
    function movePaddleTo(clientX) {
      const rect = canvas.getBoundingClientRect();
      const x = (clientX - rect.left) * (W / rect.width);
      paddle.x = Math.max(0, Math.min(W - paddle.w, x - paddle.w / 2));
      if (!launched) ball.x = paddle.x + paddle.w / 2;
    }
    canvas.addEventListener("mousemove", (e) => movePaddleTo(e.clientX));
    canvas.addEventListener("touchmove", (e) => {
      e.preventDefault();
      movePaddleTo(e.touches[0].clientX);
    }, { passive: false });

    const keys = {};
    document.addEventListener("keydown", (e) => {
      keys[e.key] = true;
      if (e.code === "Space") {
        e.preventDefault();
        if (!running) startGame();
        else launched = true;
      }
    });
    document.addEventListener("keyup", (e) => (keys[e.key] = false));

    canvas.addEventListener("click", () => (launched = true));
    startBtn.addEventListener("click", startGame);

    // --- 更新 ---
    function update() {
      if (keys["ArrowLeft"]) paddle.x = Math.max(0, paddle.x - paddle.speed);
      if (keys["ArrowRight"]) paddle.x = Math.min(W - paddle.w, paddle.x + paddle.speed);

      if (!launched) {
        ball.x = paddle.x + paddle.w / 2;
        ball.y = paddle.y - ball.r - 1;
        return;
      }

      ball.x += ball.dx;
      ball.y += ball.dy;

      // 壁
      if (ball.x - ball.r < 0) { ball.x = ball.r; ball.dx *= -1; }
      if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.dx *= -1; }
      if (ball.y - ball.r < 0) { ball.y = ball.r; ball.dy *= -1; }

      // 落下
      if (ball.y - ball.r > H) {
        lives--;
        updateHud();
        if (lives <= 0) return gameOver("ゲームオーバー");
        resetBall();
        return;
      }

      // パドル
      if (
        ball.dy > 0 &&
        ball.y + ball.r >= paddle.y &&
        ball.y + ball.r <= paddle.y + paddle.h &&
        ball.x >= paddle.x &&
        ball.x <= paddle.x + paddle.w
      ) {
        const hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
        const speed = Math.hypot(ball.dx, ball.dy);
        const angle = hit * (Math.PI / 3); // 最大60度
        ball.dx = speed * Math.sin(angle);
        ball.dy = -Math.abs(speed * Math.cos(angle));
      }

      // ブロック
      for (const b of bricks) {
        if (!b.alive) continue;
        if (
          ball.x + ball.r > b.x &&
          ball.x - ball.r < b.x + brick.w &&
          ball.y + ball.r > b.y &&
          ball.y - ball.r < b.y + brick.h
        ) {
          b.alive = false;
          score += 10;
          updateHud();
          // 上下からの当たりを簡易判定
          const prevY = ball.y - ball.dy;
          if (prevY <= b.y || prevY >= b.y + brick.h) ball.dy *= -1;
          else ball.dx *= -1;
          break;
        }
      }

      if (bricks.every((b) => !b.alive)) gameOver("クリア！おめでとう");
    }

    // --- 描画 ---
    function draw() {
      ctx.clearRect(0, 0, W, H);

      for (const b of bricks) {
        if (!b.alive) continue;
        ctx.fillStyle = b.color;
        ctx.fillRect(b.x, b.y, brick.w, brick.h);
      }

      ctx.fillStyle = "#e2e8f0";
      ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);

      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fillStyle = "#38bdf8";
      ctx.fill();

      if (!launched && running) {
        ctx.fillStyle = "#94a3b8";
        ctx.font = "14px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("クリック／スペースでボールを発射", W / 2, H / 2);
      }
    }

    function loop() {
      if (!running) return;
      update();
      draw();
      requestAnimationFrame(loop);
    }

    function startGame() {
      overlay.classList.remove("show");
      resetGame();
      running = true;
      loop();
    }

    function gameOver(message) {
      running = false;
      overlayTitle.textContent = message + `（スコア ${score}）`;
      startBtn.textContent = "もう一度";
      overlay.classList.add("show");
    }

    // 初期表示
    buildBricks();
    draw();
    overlay.classList.add("show");
  </script>
</body>
</html>
