スクリプト.md
こんにちは。今日はよくお集まりいただきました。ただいま紹介に預かりました講師の早崎と申します。今回のアイデアソンでは、講師という立場ながら、私自身も生成AIを活用してビジネスを展開し、皆様と一緒に知見を深めていければと考えております。そのためにも、まずはこの時間でアイデアソンを走り切る前の必要な情報と、私が考える生成AIと向き合う上で必要なトピックをいくつか共有したいと思います。

それでは、まず私が何者なのかという点からご説明したいと思います。私は今ではフリーランスとして活動しておりますが、本来は製造業を10年以上、ものづくりの現場でキャリアを積んでまいりました。例えばそれは、機械の精密加工から組み立て、そして修理や設計、検査といった製造という名のつくものに関しては、一通り経験をしてきた経歴になります。その中で30を超えてからITに出会う機会が多くなり、強い興味を持ったことからエンジニアに転身したという次第です。エンジニアに転向してからというものの、オンプレミスという物理的なサーバーと向き合い、設計、構築、運用を行いつつ、今はAWSやAzureといったクラウドインフラの各種業務に従事しております。

インフラ領域ではありますが、様々な方面に自分の知見を活かし、AIと共に私の業務に向き合っております。

ですので、ものづくりに関して目に見えるもの、見えないもの、それと向き合いながら経歴を重ねてきた背景がございます。

さあ、それでは本来のAIセミナーの内容に移りましょう。

それでは、長々とした口説を垂れる前に、この講義の内容を一言で表すならば、私はこれを皆様にお伝えしたいと思います。画面をご覧ください。こちら、「まず、形にしてみる」です。これの意味は。セミナーの中で解説していきますが、私が最も皆様にお伝えしたいことがまず、作り出すことなのです。今回のセミナーでは、その作るために必要なインプットを皆様に共有できれば大変喜ばしいことでございます。

ただ、形にしてみるにも必要な知識というのはあるかと思います。今回は特に生成AIを題材としておりますので、そのAIを活用してものを作るといったことに関しては、やはりそれに適応した知識もございます。ですので、今回のセミナー、今からお見せする資料では、以下の要点を踏まえて皆様にご説明差し上げればと考えております。まず、生成AIに関する知識の深掘りでございます。生成AIとは何なのか、これまでのAIとの違いは何があるのか、そして生成AIを活用する上で、様々なレベル別の活用方法なども皆様にご提示してまいりたいと考えております。

次に、システム構築をするといったことに関して、現代的なシステム開発ではどのような手法が取られるのか、そういったことも説明してまいりたいと思います。もちろんこれは開発者、私のようなエンジニア側の知識ではあるのですが、現状では生成AIはこの開発手法というものに非常に相性がいいものになっております。こちらを皆様にご理解いただくことで、より生成AIを活用する上で効率的な開発につながると考えております。推測しておりますので、ぜひご説明させていただければと思います。

最後に、皆様、事前アンケートで非常に詳細にご回答いただいた内容を拝見しておりまして、その中で皆様もAI活用されていることと存じております。その中で、生成AIの回答をどれほど信頼すればよいのか、セキュリティ的なリスクはもちろんのこと、気をつけなければならないことがあるのではないか。そういったことにも、今回のセミナーで言及できて、皆様と一緒により良いAI活用に踏まえた知識の共有ができればと考えております。

ですので、このセミナーのゴールとしては、まず作るために必要な知識である生成AIとは何か。生成AIで作成できるのは今のところアプリケーションやITシステムなので、システムを開発するために必要な知識は何か。そして、生成AIを扱う上で気をつけなければならない点。概要をお伝えしますと、生成AIが誤った情報を出してしまった場合にどうするか。セキュリティ的な観点から何を気にしなければならないかといったトピックにも言及したいと思います。

これを言葉で定義すると、今回のゴールとしては、
・生成AIとは何かをご自分の言葉で人に伝えられること。
・生成AIを活用してシステム開発を行うといったフローが、具体と抽象のレベルは問わずともイメージができること。そして、
・生成AIを扱う上で気をつけなければならない点が、ご自身の中で分別に足る指標を得ること。

この3点がご自分の中に残れば、本セミナーのゴールとしては達成できたとご認識いただいてよろしいかと存じます。

また、今回は皆様に質問やご不明点に関する疑問を解消するべく、こちらのコミュニケーションツールをご用意させていただきました。Slidoというアプリケーションでして、こちらのQRコードを読み込んでいただくと、お手元のスマートフォンもしくはデバイスで簡単な質問事項が皆様のお手元から送信することができます。これは匿名で、もちろんお名前を付けていただくことも可能ではございますが、ご自由に質問事項を募ることができますので、こちらもぜひご活用いただければと思います。今の画面からQRコードを読み取っていただくと参加できますので、どうぞご活用ください。

また、セミナーを始める前の注意事項に関してお伝えできればと思います。こちら、今から申し上げる内容は、私がITの現場の中で、かつ様々な文献やセミナーから集めた情報でございます。情報の正確性には細心の注意を払っておりますが、皆様のご認識と疑える部分もあるかもしれません。そちらに関しては、ぜひその真意についても議論できればと思いますし、内容の出典に関しては、ご希望であればすぐに共有させていただきますので。何かご質問があった際は、ぜひお気軽にお申し付けください。

それでは最初のセクションとして、まずAIとは何かを深掘っていこうと思います。皆さん、AIとは何でしょうか。いわゆる人工知能と言われているものですが、AIという定義は講義の意味になるので、もう少し深掘りしていきましょう。機械学習、マシンラーニングという言葉を聞いたことがあるでしょうか。それに並んで、Deep Learning、深層学習ですね。それぞれの違いはざっくり申し上げますと、今映し出している表のようになっております。

AIという概念的な要素があって、その中に機械学習、そしてそれを内包した状態で深層学習があると。生成AIはこちらの深層学習の一つに区分されるというふうに私は理解しております。とにかくこの時点では、それぞれの層によって機械学習の中でもいろんな派閥があるんだなというふうにご理解いただければと思います。

ここで、今回のセミナーでは、より広い意味である機械学習にフォーカスして、生成AIとの違いを分析していこうと思います。

そもそも、機械学習と従来のプログラミングによる課題解決の違いについて、フォーカスしていきたいと思います。

これは、講義の意味でも、人類が取り組んでいた課題をAIがどのように解決するかの理解の一助になると思いますので、抽象的な目線で聞いていただければと思います。

こちらのページでは、従来のプログラミングによる課題解決のプロセス、機械学習による課題解決のプロセス、そして推論をさらに発展して、機械学習で推論を用いて何ができるか、どのようなプロセスで課題を解決するか、といったものを表しています。

共通しているのは、インプットとなるデータに対して、どのような規則でデータを処理していくか。

こちらの手法が3者3様、それぞれ異なっているというふうになります。

従来のプログラミングでは、開発者が自ら用意した一定の規則に従ってデータを処理します。

これはべき等性が保たれており、何千回、何万回、仕様がその値は変わらないものになります。

対して、機械学習による処理のプロセスは開発者が自身で処理のプロセスを書くのではなく、あくまでアルゴリズムを設計、構築することで、そのアルゴリズム自身がデータを俯瞰して処理、分析、判断を行い、アルゴリズムが自発的にデータを加工するといった作業を行います。

